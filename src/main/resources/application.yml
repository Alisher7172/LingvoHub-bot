spring:
  datasource:
    url: jdbc:sqlite:database.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false
  main:
    banner-mode: off
    # Non-web app: keep JVM running for Telegram long polling
    keep-alive: true

telegram:
  # Production/VPS: set TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME, ADMIN_IDS env vars
  # Local testing: use profile "local" + application-local.yml (see application-local.example.yml)
  bot-token: ${TELEGRAM_BOT_TOKEN}
  bot-username: ${TELEGRAM_BOT_USERNAME}
  admin-ids: ${ADMIN_IDS:0}

logging:
  level:
    root: INFO
    uz.lingvohub: INFO
    org.telegram: INFO
